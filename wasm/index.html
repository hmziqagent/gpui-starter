<!doctype html>
<!-- Wasm dev harness for gpui-starter.

     Served by wasm/serve.sh (COOP/COEP required so wasm_thread can use
     SharedArrayBuffer / crossOriginIsolated). The gpui web platform
     (gpui-pre-web) CREATES ITS OWN <canvas> (100% x 100%, display:block) and
     appends it to document.body when the window opens — this page only
     provides full-viewport styling, a loading indicator, and an error
     surface so a failed boot is visible without opening devtools.

     Artifacts come from wasm/build.sh (wasm-bindgen --target web):
       ./pkg/gpui_starter.js + ./pkg/gpui_starter_bg.wasm
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gpui-starter (wasm)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b1c26;
      color: #e6e6ef;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    #loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #e6e6ef;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .coi-status {
      font-size: 12px;
      opacity: 0.65;
      font-family: ui-monospace, monospace;
    }
    #errors {
      display: none;
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      max-height: 45%;
      overflow: auto;
      z-index: 20;
      background: #3a1113;
      border: 1px solid #a33;
      border-radius: 6px;
      padding: 10px 12px;
      font: 12px/1.5 ui-monospace, monospace;
      color: #ffd9d9;
      white-space: pre-wrap;
    }
  </style>
  <script>
    // Error surface: registered before anything else can fail so a broken
    // boot is visible in the DOM (not only in devtools). Panel stays hidden
    // while empty — "app rendered" implies it never appears.
    (function () {
      var panel = null;
      function show(message) {
        if (!panel) {
          panel = document.createElement("div");
          panel.id = "errors";
          document.body.appendChild(panel);
        }
        panel.style.display = "block";
        panel.textContent += message + "\n";
      }
      window.__wasmShowError = show;
      window.addEventListener("error", function (e) {
        show((e.error && e.error.stack) || e.message || String(e));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        show("Unhandled rejection: " + ((r && (r.stack || r.message)) || String(r)));
      });
    })();
  </script>
  <script>
    // WebGL screenshot fidelity: without `preserveDrawingBuffer` the browser
    // invalidates the drawing buffer after compositing, and headless
    // (software-rasterized) capture pipelines photograph the gpui canvas as
    // a blank rectangle even while the app renders correctly on screen. The
    // app renders via wgpu's WebGL2 backend, so force the flag for every
    // webgl/webgl2 context created on this page. Minor perf cost, exact
    // pixels for screenshots/CI — the right trade for a dev harness.
    (function () {
      var orig = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, opts) {
        if (type === "webgl" || type === "webgl2") {
          return orig.call(this, type, Object.assign({}, opts || {}, {
            preserveDrawingBuffer: true,
          }));
        }
        return orig.call(this, type, opts);
      };
    })();
  </script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading gpui-starter (wasm)…</div>
    <div class="coi-status">crossOriginIsolated: <span id="coi">…</span></div>
  </div>
  <script>
    // Report isolation status (needs the COOP/COEP headers serve.sh sends).
    document.getElementById("coi").textContent = String(window.crossOriginIsolated);
  </script>
  <script type="module">
    // Hide the loading indicator once the gpui web platform has appended its
    // canvas to <body> — that (plus an empty #errors) is the DOM-level proof
    // that the app booted and rendered.
    const loading = document.getElementById("loading");
    const observer = new MutationObserver(() => {
      if (document.querySelector("body > canvas")) {
        observer.disconnect();
        loading.remove();
      }
    });
    observer.observe(document.body, { childList: true });

    // Instantiate the module; `#[wasm_bindgen(start)]` (src/web.rs) runs the
    // shared bootstrap during initialization — no explicit call needed.
    import("./pkg/gpui_starter.js")
      .then((mod) => mod.default())
      .catch((err) => {
        loading.querySelector("div").textContent = "Failed to load wasm module";
        window.__wasmShowError((err && (err.stack || err.message)) || String(err));
      });
  </script>
</body>
</html>
